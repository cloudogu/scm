{{- if .Values.migrationJob.enabled }}

{{/*The name of the PVC to be used as migration target, which must match the PVC that is used by the statefulset. */}}
{{- $pvcName := printf "scm-data-%s-0" (include "scm.fullname" .) }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvcName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "scm.labels" . | nindent 4 }}
    {{- include "scm.backupLabels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.scm.persistence.size }}
  volumeMode: Filesystem
  {{- if .Values.scm.persistence.storageClassName }}
  storageClassName: {{ .Values.scm.persistence.storageClassName | quote }}
  {{- end }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "scm.fullname" . }}-pvc-migration
  labels:
    k8s.cloudogu.com/migration-job: "true"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        k8s.cloudogu.com/dogu.name: scm
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pvc-migration
          image: "{{ .Values.migrationJob.image.registry }}/{{ .Values.migrationJob.image.repository }}:{{ .Values.migrationJob.image.tag }}"
          command: [ "sh", "-ec"]
          args:
            - |
              cp -a /source/localConfig /target/
              cp -a /source/data /target/
              cp -a /source/custom.init.script.d /target/
          volumeMounts:
            - mountPath: /source
              name: source-data
              readOnly: true
            - mountPath: /target
              name: target-data

      restartPolicy: Never
      volumes:
        - name: source-data
          persistentVolumeClaim:
            claimName: scm-migration
        - name: target-data
          persistentVolumeClaim:
            claimName: {{ $pvcName }}
{{- end }}
