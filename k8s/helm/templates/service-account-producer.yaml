# Registers scm as a ServiceAccountProducer
apiVersion: k8s.cloudogu.com/v2
kind: ServiceAccountProducer
metadata:
  name: {{ include "scm.name" . }}
  labels:
    {{- include "scm.labels" . | nindent 4 }}
spec:
  producer: {{ include "scm.name" . }}
  http:
    endpoint: "http://{{ include "scm.name" . }}.{{ .Release.Namespace }}.svc:{{ (index .Values.scm.service.ports "sa-manager").port }}/serviceaccounts"
    authSecret:
      name: {{ include "scm.fullname" . }}-sa-manager-auth
      key: apiKey
    priority: 1
    # params/return live under spec.http (verified against the ServiceAccountProducer CRD's
    # OpenAPI schema in-cluster) - the ADR-0055 draft sketches them as spec-level siblings of
    # http, which the actual CRD does not accept.
    params:
      # TODO
    return:
      # TODO
