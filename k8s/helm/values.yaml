global:
  imagePullSecrets:
    - name: "ces-container-registries"

networkPolicies:
  enabled: true

extraLabels: {}

scm:
  replicas: 1

  # Integrations with other dogus.
  # An enabled integration installs and configures the corresponding SCM-Manager plugins.
  # Changes take effect on the next SCM-Manager start; disabling an integration does not uninstall plugins.
  integrations:
    cockpit:
      enabled: false
    jenkins:
      enabled: false
    redmine:
      enabled: false
      # REDMINE | EASY_REDMINE
      type: EASY_REDMINE
    jira:
      enabled: false

  image:
    registry: registry.cloudogu.com
    repository: official/scm
    tag: 3.11.10-1
  imagePullPolicy: IfNotPresent

  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  resourceLimits:
    memory: 500Mi
  resourceRequests:
    cpu: 126m
    memory: 500Mi

  persistence:
    size: 2Gi
    storageClassName: ""
    # Use an existing PersistentVolumeClaim for the scm data volume instead of
    # letting the chart create one. When set, no PVC is created and its size/
    # storageClassName above are ignored.
    existingClaim: ""

  exposition:
    externalPort: 2222
  service:
    ports:
      web:
        protocol: TCP
        port: 8080
        targetPort: web
      ssh:
        protocol: TCP
        port: 2222
        targetPort: ssh
      sa-manager:
        protocol: TCP
        port: 8090
        targetPort: sa-manager

  extraVolumeMounts: []
  extraEnv: []
  extraVolumes: []
  extraInitContainers: []

  tolerations: []
  affinity: {}
  nodeSelector: {}

  # Dogu-Configuration
  configuration:
    configEnv:
      doguName: "scm"
      doguRegistryDir: "/scm/doguregistry"
      globalConfigDir: "/scm/configuration/global"
      doguConfigDir: "/scm/configuration/normal"
      sensitiveConfigDir: "/scm/configuration/sensitive"
      localConfigDir: "/scm/configuration/local"
    meta:
      global:
        name: global-config
        key: config.yaml
      normal:
        key: normal
      sensitive:
        key: sensitive
    normal: # config.yaml style; slash-keys from dogu.json become nested keys
      logging:
        root: "WARN"
      container_config:
        java_max_ram_percentage: "25.0"
        java_min_ram_percentage: "50.0"

  # scm-sa-manager sidecar
  saManager:
    image:
      registry: registry.cloudogu.com
      repository: k8s/service-account-producer-sidecar
      tag: "0.1.3"
    imagePullPolicy: IfNotPresent
    logLevel: INFO
    resourceRequests:
      cpu: 50m
      memory: 64Mi
    resourceLimits:
      memory: 64Mi

# Migration from dogu v2
migrationJob:
  enabled: false
  image:
    registry: docker.io
    repository: library/busybox
    tag: "1.38"

# Self-contained gotenberg
gotenberg:
  enabled: true
  replicas: 1
  image:
    registry: docker.io
    repository: gotenberg/gotenberg
    tag: "8.34.0"
  imagePullPolicy: IfNotPresent
  resourceRequests:
    cpu: 15m
    memory: 200Mi
  resourceLimits:
    memory: 200Mi
  extraVolumes: []
  service:
    ports:
      api:
        protocol: TCP
        port: 3000
        targetPort: api
